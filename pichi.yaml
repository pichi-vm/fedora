version: 1

stages:
  rootfs:
    use: !bootstrap ghcr.io/pichi-vm/fedora:43
    mounts:
      /run: tmpfs
      /tmp: tmpfs
      /var: tmpfs
    steps:
      - exec:
          command: |
            dnf -y --installroot=/mnt --use-host-config --releasever=43 \
              --setopt=install_weak_deps=False install \
              filesystem systemd systemd-udev kernel-core kernel-modules \
              bash coreutils dnf glibc-minimal-langpack ca-certificates
          network: true
  tools:
    extend: rootfs
    mounts:
      /run: tmpfs
      /tmp: tmpfs
      /var: tmpfs
    steps:
      - copy: { path: scripts, into: /build/copr/scripts/ }
      - copy: { path: keys, into: /build/copr/keys/ }
      - copy: { path: packages.lock.json, into: /build/copr/packages.lock.json }
      - exec:
          command: |
            dnf -y --setopt=install_weak_deps=False install python3 rpm
            cd /build/copr
            python3 scripts/copr.py download --out /tmp/rpms \
              --arch "$(uname -m)" --packages arma corium
            project=$(python3 -c 'import json; print(json.load(open("packages.lock.json"))["project"])')
            rpmkeys --import "keys/$project.asc"
            dnf -y --setopt=install_weak_deps=False --setopt=localpkg_gpgcheck=True \
              install /tmp/rpms/*.rpm
          network: true
  firmware:
    extend: tools
    mounts:
      /tmp: tmpfs
    steps:
      - exec:
          command: >-
            /usr/bin/arma build --kernel /usr/lib/modules/*/vmlinuz
            --config /usr/lib/modules/*/config --initrd /usr/bin/corium
            --module virtio_pci --module virtio_blk --module virtio_console
            --module dm_mod --module dm_zero --module dm_snapshot
            --module dm_verity --module ext4
            --cmdline bootconfig --dtb attached /boot.pmi

image:
  root: rootfs
  boot:
    extract: { from: firmware, path: /boot.pmi }
    define:
      corium.root: ""
      kernel.ro: [ ]
      kernel.console: hvc0
      kernel.SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST: "40"
      kernel.systemd.volatile: state
      kernel.systemd.unit: multi-user.target
      kernel.systemd.show_status: "false"

requirements:
  cpus: { recommended: 2 }
  memory: { required: 1024, recommended: 2048 }

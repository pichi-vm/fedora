version: 1

stages:
  rootfs:
    use: !bootstrap ghcr.io/pichi-vm/fedora:43
    mounts:
      /run: tmpfs
      /tmp: tmpfs
      /var: tmpfs
    steps:
      - exec:
          command: |
            dnf -y --installroot=/mnt --use-host-config --releasever=43 \
              --setopt=install_weak_deps=False install \
              filesystem systemd systemd-udev kernel-core kernel-modules \
              bash coreutils dnf glibc-minimal-langpack ca-certificates
          network: true
  tools:
    extend: rootfs
    mounts:
      /run: tmpfs
      /tmp: tmpfs
      /var: tmpfs
    steps:
      - exec:
          command: >-
            dnf -y --setopt=install_weak_deps=False install
            gcc rust cargo lld glibc-static
            "rust-std-static-$(uname -m)-unknown-none*"
          network: true
  arma:
    use: tools
    steps:
      - copy: { path: sources/arma, into: /build/arma/ }
      - exec:
          command: |
            cd /build/arma
            RUSTC_BOOTSTRAP=1 cargo build --locked --release --bin arma
            install -m0755 target/release/arma /mnt/arma
          network: true
  corium:
    use: tools
    steps:
      - copy: { path: sources/corium, into: /build/corium/ }
      - exec:
          command: |
            cd /build/corium
            cargo rustc --locked --release --bin corium \
              -- -C target-feature=+crt-static
            install -m0755 target/release/corium /mnt/corium
          network: true
  firmware:
    extend: rootfs
    mounts:
      /tmp: tmpfs
    steps:
      - copy: { from: arma, path: /arma, into: /tmp/arma }
      - copy: { from: corium, path: /corium, into: /tmp/corium }
      - exec:
          command: >-
            /tmp/arma build --kernel /usr/lib/modules/*/vmlinuz
            --config /usr/lib/modules/*/config --initrd /tmp/corium
            --module virtio_pci --module virtio_blk --module virtio_console
            --module dm_mod --module dm_zero --module dm_snapshot
            --module dm_verity --module ext4
            --cmdline bootconfig --dtb attached /boot.pmi

image:
  root: rootfs
  boot:
    extract: { from: firmware, path: /boot.pmi }
    define:
      corium.root: ""
      kernel.ro: [ ]
      kernel.console: hvc0
      kernel.SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST: "40"
      kernel.systemd.volatile: state
      kernel.systemd.unit: multi-user.target
      kernel.systemd.show_status: "false"

requirements:
  cpus: { recommended: 2 }
  memory: { required: 1024, recommended: 2048 }

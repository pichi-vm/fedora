#
# The PMI's systemd initramfs. Built on mkosi's bundled `mkosi-initrd` (systemd
# + udev + the usual dm/virtio/ext4 modules), with three carapace additions:
#
#   * dm-snapshot — the cow layer under every scute (mkosi-initrd ships
#     dm-verity + dm-mod but not dm-snapshot);
#   * the carapace binary + its systemd generator symlink, staged by build.sh
#     into ./mkosi.extra (mkosi copies mkosi.extra verbatim). systemd runs the
#     generator, which turns `carapacehash=` into carapace-attach.service and
#     assembles /dev/mapper/root before initrd-root-device.target;
#   * uncompressed output — arma rejects compressed initrds.
#
# build.sh pins the kernel to the exact NEVRA from the rootfs build so the
# initramfs modules match the PMI kernel and the carapace's /usr/lib/modules.

[Include]
Include=mkosi-initrd

[Distribution]
Distribution=fedora
Release=43

[Content]
KernelModulesInclude=/dm-snapshot.ko

[Output]
Output=initrd
# arma rejects compressed initrds.
CompressOutput=none

#
# The carapace's one and only partition: a bare ext4 root. Because a custom
# mkosi.repart/ is present, mkosi drops its default partition set (no ESP —
# this image is Bootable=no and never boots itself; the PMI boots it).
#
# SplitArtifacts=partitions (mkosi.conf) makes systemd-repart write this
# partition out as a standalone `<output>.root.raw` — a filesystem image with
# no GPT wrapper — which `pichi import` ingests as the carapace scute.
#
# The filesystem is sized to the carapace's fixed apparent root-device length so
# the guest's root fills the whole device with no wasted space and no resize:
# carapace assembles the root as dm-zero of `ZERO_COUNT_SECTORS` (assemble.rs) =
# 64 GiB, and every scute snapshot's length is LOCKED to that (the kernel
# rejects a mismatch). The base ext4 must therefore be exactly 64 GiB — larger
# cannot be presented; smaller would leave unusable tail space until resize2fs.
# Growing beyond the locked length is a future carapace feature; bump this in
# lockstep with ZERO_COUNT_SECTORS if/when it lands.
#
# The size is nearly free to carry: a fresh ext4 is almost all holes
# (lazy_itable_init + metadata_csum leave inode tables / empty-group bitmaps
# unwritten) and `pichi import raw` walks the image sparsely and drops zero
# blocks, so the stored scute tracks real content, not this declared size. ext4
# at this size uses 4096-byte blocks, matching the carapace verity block size;
# build.sh asserts this on the emitted image.

[Partition]
Type=root
Format=ext4
CopyFiles=/
# Fixed size (min == max) so the fs is exactly 64 GiB = carapace ZERO_COUNT_SECTORS.
SizeMinBytes=64G
SizeMaxBytes=64G

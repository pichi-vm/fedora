#
# The PMI's systemd initramfs. Built on mkosi's bundled `mkosi-initrd` (systemd
# + udev + the usual dm/virtio/ext4 modules), with three carapace additions:
#
#   * dm-snapshot — the cow layer under every scute (mkosi-initrd ships
#     dm-verity + dm-mod but not dm-snapshot);
#   * the carapace binary + its systemd generator symlink, staged by build.sh
#     into ./mkosi.extra (mkosi copies mkosi.extra verbatim). systemd runs the
#     generator, which turns `carapacehash=` into carapace-attach.service and
#     assembles /dev/mapper/root before initrd-root-device.target;
#   * uncompressed output — arma rejects compressed initrds.
#
# This is a mkosi subimage of the parent rootfs build (../../mkosi.conf lists it
# in Dependencies=). Both images are built in one run against the same package
# repository snapshot, so the unversioned `kernel-core` below resolves to the
# SAME NEVRA as the rootfs — the initramfs modules match the PMI kernel and the
# carapace's /usr/lib/modules without a hand-plumbed version. build.sh asserts
# the two agree and fails loudly if they ever diverge.

[Include]
Include=mkosi-initrd

# Distribution/Release are inherited from the parent image (../../mkosi.conf);
# subimages may not set them.

[Content]
# The kernel whose module tree this initrd carries (see the NEVRA note above).
Packages=kernel-core
KernelModulesInclude=/dm-snapshot.ko

[Output]
Output=initrd
# arma rejects compressed initrds.
CompressOutput=none

name: CI

on:
  # Pull request branches are checked through pull_request, so each update
  # gets one run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
# Each run on main gets its own group, so runs on main are never
# cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RELEASE: "43"

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔎 Check commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            commits="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            commits="$PUSH_BEFORE..$GITHUB_SHA"
          else
            commits="$GITHUB_SHA^!"
          fi
          pipx run gitlint --commits "$commits"

  build:
    name: Build (${{ matrix.arch }})
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: avrea-ubuntu-latest-arm-4-vcpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Prepare build host
        run: |
          sudo chmod a+rw /dev/kvm
          sudo sysctl -w vm.nr_hugepages=4096
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: 📦 Install Pichi
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y pichi

      - name: 🔨 Prepare, build and save Fedora
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/fedora-image-cache
        run: |
          image=ghcr.io/pichi-vm/fedora
          digest=
          for ((page=1; ; page++)); do
            if versions=$(curl --fail-with-body --silent --show-error \
              -H 'Authorization: Bearer ${{ github.token }}' \
              "https://api.github.com/orgs/pichi-vm/packages/container/never-published-bootstrap-probe-20261108/versions?per_page=100&page=$page"); then
              digest=$(jq -r --arg tag "$RELEASE" \
                '.[] | select(.metadata.container.tags | index($tag)) | .name' <<< "$versions")
              if [ -n "$digest" ] || [ "$(jq length <<< "$versions")" -lt 100 ]; then break; fi
            else
              test "$page" -eq 1
              jq -e '.status == "404"' <<< "$versions" > /dev/null
              break
            fi
          done
          if [ -n "$digest" ]; then
            pichi pull "$image@$digest"
            pichi tag "$image@$digest" "$image:$RELEASE"
          else
            sudo apt-get install -y dnf rpm e2fsprogs
            bootstrap=$(mktemp -d "$RUNNER_TEMP/bootstrap.XXXXXX")
            trap 'sudo rm -rf "$bootstrap"' EXIT
            sudo dnf -y --installroot="$bootstrap/root" --releasever="$RELEASE" \
              --repofrompath=fedora,https://dl.fedoraproject.org/pub/fedora/linux/releases/$RELEASE/Everything/$(uname -m)/os/ \
              --repo=fedora --setopt=fedora.gpgkey=https://fedoraproject.org/fedora.gpg \
              --setopt=gpgcheck=1 --setopt=install_weak_deps=False install \
              filesystem bash coreutils dnf glibc-minimal-langpack ca-certificates
            sudo dnf --installroot="$bootstrap/root" --releasever="$RELEASE" clean all
            sudo mkfs.ext4 -F -E lazy_itable_init=0 \
              -d "$bootstrap/root" "$bootstrap/bootstrap.raw" 1G
            pichi import raw "$bootstrap/bootstrap.raw" --arch "${{ matrix.arch }}" -t "$image:$RELEASE"
          fi

          pichi build . --ref HEAD --memory 8192 \
            -t "ghcr.io/pichi-vm/fedora:$RELEASE"

          pichi save "ghcr.io/pichi-vm/fedora:$RELEASE" -o "oci-${{ matrix.arch }}"

          pichi inspect ghcr.io/pichi-vm/pichi-build:latest
          pichi inspect "ghcr.io/pichi-vm/fedora:$RELEASE" | tee cold-image.json |
            jq -e '.manifest.annotations["dev.pichi.build.bootstrapped"] == "true"'
          cat cold-image.json
          status=0
          timeout --signal=INT --kill-after=10s 60s \
            pichi run "ghcr.io/pichi-vm/fedora:$RELEASE" > cold-boot.log 2>&1 || status=$?
          cat cold-boot.log
          test "$status" -eq 124
          grep -q ' login:' cold-boot.log

      - name: ⬆️ Upload image
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [commit-messages, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📦 Install Pichi
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y pichi

      - name: ⬇️ Download images
        uses: actions/download-artifact@v4
        with:
          pattern: oci-*

      - name: 🔑 Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: 🚀 Publish image
        run: |
          pichi load "oci-amd64" --tag "fedora:${RELEASE}-amd64"
          pichi load "oci-arm64" --tag "fedora:${RELEASE}-arm64"
          list="fedora:${RELEASE}"
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64" \
            -a "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -a "org.opencontainers.image.revision=$GITHUB_SHA" \
            -a "org.opencontainers.image.version=${RELEASE}" \
            -a "org.opencontainers.image.title=Fedora ${RELEASE}" \
            -a "org.opencontainers.image.description=Fedora ${RELEASE} base OS carapace for pichi"
          # Pichi requires explicit VM platform annotations on both entries.
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/pichi-vm/fedora:$RELEASE"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Fail-fast DAG. This is the only push / pull_request entrypoint.
#
# Tier 1 — checks (parallel): regression, license headers, commit messages
# Tier 2 — image matrix, only after Tier 1 succeeds
#
# A red Tier-1 job skips the mkosi/image build.
jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: build
    needs: [checks]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

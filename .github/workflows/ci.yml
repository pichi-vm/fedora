name: CI

on:
  # Pull request branches are checked through pull_request, so each update
  # gets one run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
# Each run on main gets its own group, so runs on main are never
# cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Fail-fast DAG. This is the only push / pull_request entrypoint.
#
# Tier 1 — checks (parallel): regression, license headers, commit messages
# Tier 2 — image matrix, only after Tier 1 succeeds
#
# A red Tier-1 job skips the mkosi/image build.
jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: build
    needs: [checks]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

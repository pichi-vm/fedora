name: COPR packages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Fedora repository commit to package
        required: true
        type: string
      project:
        description: COPR destination
        type: choice
        options: [pichi-staging, pichi]
        default: pichi-staging
      packages:
        description: JSON array of package directories
        type: string
        default: '["corium", "arma", "dillo", "pichi", "madrillo"]'

permissions:
  contents: read

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    concurrency:
      group: copr-${{ inputs.project }}-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Install COPR client
        run: pipx install copr-cli
      - name: Submit and wait for both architectures
        shell: bash
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          REVISION: ${{ inputs.revision }}
          PROJECT: ${{ inputs.project }}
          PACKAGE: ${{ matrix.package }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          case "$PROJECT" in pichi|pichi-staging) ;; *) exit 1 ;; esac
          case "$PACKAGE" in corium|arma|dillo|pichi|madrillo) ;; *) exit 1 ;; esac
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          printf '%s' "$COPR_CONFIG" > "$config"
          unset COPR_CONFIG
          copr-cli --config "$config" buildscm "npmccallum/$PROJECT" \
            --clone-url https://github.com/pichi-vm/fedora.git \
            --commit "$REVISION" --subdir "packaging/$PACKAGE" \
            --spec "$PACKAGE.spec" --method make_srpm --enable-net on \
            --chroot fedora-43-x86_64 --chroot fedora-43-aarch64

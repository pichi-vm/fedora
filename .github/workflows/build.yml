name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE: "43"

jobs:
  # Build each arch natively (no QEMU) — public repos get free arm64 runners.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
      options: --privileged
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: dnf install -y mkosi e2fsprogs cargo git jq

      - name: Install pichi
        run: cargo install --git https://github.com/pichi-vm/pichi pichi

      - name: Build base carapace (native ${{ matrix.arch }})
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./build.sh

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Push per-arch manifest + record descriptor
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p desc
          pichi push "fedora:${RELEASE}" \
            "ghcr.io/${{ github.repository }}:${RELEASE}-${{ matrix.arch }}" \
            --print-descriptor \
            | jq -c '. + {arch: "${{ matrix.arch }}"}' \
            > "desc/${{ matrix.arch }}.json"
          cat "desc/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: desc-${{ matrix.arch }}
          path: desc/${{ matrix.arch }}.json

  # Assemble the per-arch manifests into one OCI image index tagged :43.
  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desc-*
          merge-multiple: true
          path: desc

      - name: Install pichi + jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          cargo install --git https://github.com/pichi-vm/pichi pichi

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Assemble + push the multi-arch index
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # platform.os = "pichi": a carapace is a pichi VM-guest rootfs, not a
          # thing "used on" an OS — producer and `pichi pull` agree on this token.
          entries=()
          for f in desc/*.json; do
            entries+=(--entry "$(jq -r '.arch + "," + .digest + "," + (.size|tostring)' "$f")")
          done
          pichi push-index "ghcr.io/${{ github.repository }}:${RELEASE}" \
            --source "https://github.com/${{ github.repository }}" \
            "${entries[@]}"

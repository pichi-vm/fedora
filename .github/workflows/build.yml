name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE: "43"
  # arma and pichi are nightly-only (artifact deps / `-Z bindeps`); arma
  # cross-compiles the tatu firmware to bare-metal targets. Pin the toolchain.
  NIGHTLY: "nightly-2026-07-06"

jobs:
  # Build each arch natively (no QEMU) — public repos get free arm64 runners.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
      # --privileged: mkosi + `unshare -r` (the rootfs strip / mkfs) need
      # user namespaces and full device access.
      options: --privileged
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system tooling
        run: >-
          dnf install -y
          mkosi e2fsprogs util-linux coreutils
          git jq gcc curl openssl-devel pkgconf-pkg-config perl

      - name: Install Rust (${{ env.NIGHTLY }} + bare-metal targets)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --profile minimal --default-toolchain "$NIGHTLY" \
            --target x86_64-unknown-none --target aarch64-unknown-none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build arma + pichi from main (nightly, -Z bindeps)
        run: |
          # Built in-repo so each crate's rust-toolchain.toml / .cargo/config
          # (bindeps, targets) apply automatically. carapace is installed by
          # build.sh itself.
          git clone --depth 1 https://github.com/pichi-vm/arma /tmp/arma
          (cd /tmp/arma && cargo build --release --bin arma)
          echo "ARMA=/tmp/arma/target/release/arma" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/pichi-vm/pichi /tmp/pichi
          (cd /tmp/pichi && cargo build --release --bin pichi)
          install -m755 /tmp/pichi/target/release/pichi /usr/local/bin/pichi

      - name: Build combined base OS image (native ${{ matrix.arch }})
        run: ./build.sh

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Push per-arch manifest + record descriptor
        run: |
          mkdir -p desc
          pichi push "fedora:${RELEASE}" \
            "ghcr.io/${{ github.repository }}:${RELEASE}-${{ matrix.arch }}" \
            --print-descriptor \
            | jq -c '. + {arch: "${{ matrix.arch }}"}' \
            > "desc/${{ matrix.arch }}.json"
          cat "desc/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: desc-${{ matrix.arch }}
          path: desc/${{ matrix.arch }}.json

  # Assemble the per-arch manifests into one OCI image index tagged :43.
  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desc-*
          merge-multiple: true
          path: desc

      - name: Install pichi
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          git clone --depth 1 https://github.com/pichi-vm/pichi /tmp/pichi
          (cd /tmp/pichi && cargo "+$NIGHTLY" build --release --bin pichi)
          sudo install -m755 /tmp/pichi/target/release/pichi /usr/local/bin/pichi

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Assemble + push the multi-arch index
        run: |
          # platform.os = "pichi": a carapace is a pichi VM-guest rootfs, not a
          # thing "used on" an OS — producer and `pichi pull` agree on this token.
          entries=()
          for f in desc/*.json; do
            entries+=(--entry "$(jq -r '.arch + "," + .digest + "," + (.size|tostring)' "$f")")
          done
          pichi push-index "ghcr.io/${{ github.repository }}:${RELEASE}" \
            --source "https://github.com/${{ github.repository }}" \
            "${entries[@]}"

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RELEASE: "43"
  # arma and pichi are nightly-only (artifact deps / `-Z bindeps`); arma
  # cross-compiles the tatu firmware to bare-metal targets. Pin the toolchain.
  NIGHTLY: "nightly-2026-07-06"

jobs:
  # Build each arch natively (no QEMU) — public repos get free arm64 runners.
  # Each build exports its image as an OCI layout directory and uploads it; no
  # arch pushes to the registry directly. The index job loads both and pushes
  # everything atomically (podman `manifest push --all` semantics).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
      # --privileged: mkosi + `unshare -r` (the rootfs strip / mkfs) need
      # user namespaces and full device access.
      options: --privileged
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system tooling
        run: >-
          dnf install -y
          mkosi systemd-standalone-repart e2fsprogs util-linux coreutils cpio
          git gcc curl openssl-devel pkgconf-pkg-config perl

      - name: Install Rust (${{ env.NIGHTLY }} + bare-metal targets)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --profile minimal --default-toolchain "$NIGHTLY" \
            --target x86_64-unknown-none --target aarch64-unknown-none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build arma + pichi from main (nightly, -Z bindeps)
        run: |
          # Built in-repo so each crate's rust-toolchain.toml / .cargo/config
          # (bindeps, targets) apply automatically. carapace is installed by
          # build.sh itself.
          git clone --depth 1 https://github.com/pichi-vm/arma /tmp/arma
          (cd /tmp/arma && cargo build --release --bin arma)
          echo "ARMA=/tmp/arma/target/release/arma" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/pichi-vm/pichi /tmp/pichi
          (cd /tmp/pichi && cargo build --release --bin pichi)
          install -m755 /tmp/pichi/target/release/pichi /usr/local/bin/pichi

      - name: Build combined base OS image (native ${{ matrix.arch }})
        run: ./build.sh

      - name: Export image as an OCI layout directory
        run: pichi save "fedora:${RELEASE}" -o "oci-${{ matrix.arch }}"

      - name: Upload OCI layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  # Load every per-arch OCI layout, assemble one multi-arch OCI image index
  # tagged :43, and push it atomically (blobs + arch manifests + the index).
  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install pichi
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          git clone --depth 1 https://github.com/pichi-vm/pichi /tmp/pichi
          (cd /tmp/pichi && cargo "+$NIGHTLY" build --release --bin pichi)
          sudo install -m755 /tmp/pichi/target/release/pichi /usr/local/bin/pichi

      - name: Download OCI layout artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oci-*

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Load, assemble, and push the multi-arch index
        run: |
          # Load each arch under a distinct local tag so `manifest create` can
          # reference both from the local cache (no registry round-trip).
          pichi load "oci-amd64" --tag "fedora:${RELEASE}-amd64"
          pichi load "oci-arm64" --tag "fedora:${RELEASE}-arm64"
          list="fedora:${RELEASE}"
          # platform.os = "pichi": a carapace is a pichi VM-guest rootfs, not a
          # thing "used on" an OS — producer and `pichi pull` agree on this token.
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64"
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/${{ github.repository }}:${RELEASE}"

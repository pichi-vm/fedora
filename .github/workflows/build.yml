name: build

on:
  # Called from ci.yml. Manual dispatch remains
  # available; push and pull_request do not start this workflow directly.
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RELEASE: "43"
  BUILD_IMAGE: "ghcr.io/pichi-vm/conglobate@sha256:dda6d25f6f51ad171611f159f4202bdec4e50482d6e741ad566c1b4d7c61d946"

jobs:
  # Validate alongside builds; publication requires both to succeed.
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: avrea-ubuntu-latest-arm-4-vcpu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve build VM memory
        run: |
          sudo chmod a+rw /dev/kvm
          sudo sysctl -w vm.nr_hugepages=4096
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: Install Pichi and Dillo
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get update
          sudo apt-get install -y pichi dillo-vm
          echo "PICHI_DILLO=/usr/bin/dillo" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/fedora-image-cache" >> "$GITHUB_ENV"

      - name: Build Fedora
        run: |
          pichi pull ghcr.io/pichi-vm/fedora:43
          pichi build . --ref HEAD --build-image "$BUILD_IMAGE" --memory 8192 \
            -t ghcr.io/pichi-vm/fedora:43

      - name: Export production image
        run: pichi save ghcr.io/pichi-vm/fedora:43 -o "oci-${{ matrix.arch }}"

      - name: Upload OCI layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  # Load every per-arch OCI layout, assemble one multi-arch OCI image index
  # tagged :43, and push it atomically (blobs + arch manifests + the index).
  index:
    # Feature branches and PRs validate both architectures without publishing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Pichi
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get update
          sudo apt-get install -y pichi

      - name: Download OCI layout artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oci-*

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Load, assemble, and push the multi-arch index
        run: |
          # Load each arch under a distinct local tag so `manifest create` can
          # reference both from the local cache (no registry round-trip).
          pichi load "oci-amd64" --tag "fedora:${RELEASE}-amd64"
          pichi load "oci-arm64" --tag "fedora:${RELEASE}-arm64"
          list="fedora:${RELEASE}"
          # platform.os = "pichi": a carapace is a pichi VM-guest rootfs, not a
          # thing "used on" an OS — producer and `pichi pull` agree on this token.
          # Stamp index-level provenance (whole multi-arch image); `created` is
          # added automatically.
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64" \
            -a "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -a "org.opencontainers.image.revision=${{ github.sha }}" \
            -a "org.opencontainers.image.version=${RELEASE}" \
            -a "org.opencontainers.image.title=Fedora ${RELEASE}" \
            -a "org.opencontainers.image.description=Fedora ${RELEASE} base OS carapace for pichi"
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/${{ github.repository }}:${RELEASE}"

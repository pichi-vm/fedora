name: build

on:
  # Called from ci.yml. Manual dispatch remains
  # available; push and pull_request do not start this workflow directly.
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RELEASE: "43"
  NIGHTLY: "nightly-2026-07-06"
  BUILD_IMAGE: "ghcr.io/pichi-vm/conglobate@sha256:2239264c3281d53beedabdbfe8b3c587ac8ff8f2e87d4642e192f943f6cd5c45"

jobs:
  # Validate alongside builds; publication requires both to succeed.
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # Prepare native seeds on Ubuntu; the ARM KVM runner uses NixOS.
  tool-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
        with:
          workspaces: sources/pichi -> target

      - name: Build Pichi
        run: |
          (cd sources/pichi && cargo "+$NIGHTLY" build --locked --release --bin pichi)
          echo "$GITHUB_WORKSPACE/sources/pichi/target/release" >> "$GITHUB_PATH"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/fedora-image-cache" >> "$GITHUB_ENV"

      - name: Obtain the Fedora tool image
        run: |
          mkdir -p .build
          if ! pichi pull ghcr.io/pichi-vm/fedora:43; then
            sudo apt-get update
            sudo apt-get install -y dnf rpm e2fsprogs
            sudo dnf -y --installroot="$RUNNER_TEMP/fedora-root" --releasever=43 \
              --repofrompath=fedora,https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/$(uname -m)/os/ \
              --repo=fedora --setopt=fedora.gpgkey=https://fedoraproject.org/fedora.gpg \
              --setopt=gpgcheck=1 --setopt=install_weak_deps=False install \
              filesystem bash coreutils dnf glibc-minimal-langpack ca-certificates
            sudo dnf --installroot="$RUNNER_TEMP/fedora-root" --releasever=43 clean all
            sudo mkfs.ext4 -F -d "$RUNNER_TEMP/fedora-root" .build/bootstrap.raw 1G
            pichi import raw .build/bootstrap.raw -t ghcr.io/pichi-vm/fedora:43
          fi
          pichi inspect ghcr.io/pichi-vm/fedora:43 > .build/seed.json
          pichi save ghcr.io/pichi-vm/fedora:43 -o .build/tool-image

      - name: Upload native tool image
        uses: actions/upload-artifact@v4
        with:
          name: tool-image-${{ matrix.arch }}
          path: |
            .build/tool-image
            .build/seed.json
          include-hidden-files: true

  build:
    needs: tool-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [ self-hosted, Linux, ARM64, bare-metal, aarch64, kvm ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reserve build VM memory
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            sudo chmod a+rw /dev/kvm
            sudo sysctl -w vm.nr_hugepages=4096
          fi
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: Install toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
          CARGO_UNSTABLE_BINDEPS: "true"
        with:
          workspaces: |
            sources/pichi -> target
            sources/dillo -> target
          cache-targets: false
          cache-directories: |
            ${{ github.workspace }}/sources/pichi/target
            ${{ github.workspace }}/sources/dillo/target
          save-if: ${{ runner.environment == 'github-hosted' || github.ref == 'refs/heads/main' }}

      - name: Build Pichi and Dillo
        run: |
          (cd sources/pichi && cargo "+$NIGHTLY" build --locked --release --bin pichi)
          echo "$GITHUB_WORKSPACE/sources/pichi/target/release" >> "$GITHUB_PATH"
          (cd sources/dillo && cargo "+$NIGHTLY" --config packaging/cargo-config.toml build --locked --release --bin dillo)
          echo "PICHI_DILLO=$GITHUB_WORKSPACE/sources/dillo/target/release/dillo" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/fedora-image-cache" >> "$GITHUB_ENV"

      - name: Download native tool image
        uses: actions/download-artifact@v4
        with:
          name: tool-image-${{ matrix.arch }}
          path: .build

      - name: Build Fedora
        run: |
          pichi load .build/tool-image --tag ghcr.io/pichi-vm/fedora:43
          pichi build . --ref HEAD --build-image "$BUILD_IMAGE" --memory 8192 \
            -t qualification.local/fedora:f1

      - name: Qualify Fedora successor builds
        run: |
          original=$(git rev-parse HEAD)
          pichi inspect qualification.local/fedora:f1 > .build/f1.json
          test "$(pichi inspect qualification.local/fedora:f1 --format \
            '{{ manifest.annotations["dev.pichi.build.commit"] }}')" = "sha1:$original"
          test "$(pichi inspect qualification.local/fedora:f1 --format \
            '{{ manifest.annotations["dev.pichi.build.bootstrapped"] }}')" = true
          test "$(pichi inspect qualification.local/fedora:f1 --format \
            '{{ "dev.pichi.build.lock" in manifest.annotations }}')" = false

          pichi tag qualification.local/fedora:f1 ghcr.io/pichi-vm/fedora:43
          sed -i 's/!bootstrap //' pichi.yaml
          pichi update --pull=never
          git add pichi.yaml pichi.lock
          git -c user.name="Pichi CI" -c user.email="ci@pichi.invalid" \
            commit -m "test: use the first Fedora image as input"
          git bundle create .build/successor.bundle HEAD
          pichi build . --ref HEAD --build-image "$BUILD_IMAGE" --memory 8192 \
            -t qualification.local/fedora:f2
          pichi inspect qualification.local/fedora:f2 > .build/f2.json
          test "$(pichi inspect qualification.local/fedora:f2 --format \
            '{{ manifest.annotations["dev.pichi.build.commit"] }}')" = "sha1:$(git rev-parse HEAD)"
          test "$(pichi inspect qualification.local/fedora:f2 --format \
            '{{ "dev.pichi.build.bootstrapped" in manifest.annotations }}')" = false
          test "$(pichi inspect qualification.local/fedora:f2 --format \
            '{{ manifest.annotations["dev.pichi.build.lock"] }}')" = pichi.lock
          grep -F "$(pichi inspect qualification.local/fedora:f1 --format '{{ digest }}')" pichi.lock

          pichi build . --ref "$original" --build-image "$BUILD_IMAGE" --memory 8192 \
            -t ghcr.io/pichi-vm/fedora:43
          pichi inspect ghcr.io/pichi-vm/fedora:43 > .build/recursive.json
          test "$(pichi inspect ghcr.io/pichi-vm/fedora:43 --format \
            '{{ manifest.annotations["dev.pichi.build.commit"] }}')" = "sha1:$original"
          test "$(pichi inspect ghcr.io/pichi-vm/fedora:43 --format \
            '{{ manifest.annotations["dev.pichi.build.bootstrapped"] }}')" = true
          test "$(pichi inspect ghcr.io/pichi-vm/fedora:43 --format \
            '{{ "dev.pichi.build.lock" in manifest.annotations }}')" = false

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-evidence-${{ matrix.arch }}
          path: |
            .build/*.json
            .build/successor.bundle
          include-hidden-files: true

      - name: Export production image
        run: pichi save qualification.local/fedora:f1 -o "oci-${{ matrix.arch }}"

      - name: Upload OCI layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  # Load every per-arch OCI layout, assemble one multi-arch OCI image index
  # tagged :43, and push it atomically (blobs + arch manifests + the index).
  index:
    # Feature branches and PRs validate both architectures without publishing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
        with:
          workspaces: sources/pichi -> target

      - name: Install pichi
        run: |
          (cd sources/pichi && cargo "+$NIGHTLY" build --locked --release --bin pichi)
          sudo install -m755 sources/pichi/target/release/pichi /usr/local/bin/pichi

      - name: Download OCI layout artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oci-*

      - name: Authenticate to ghcr.io
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: Load, assemble, and push the multi-arch index
        run: |
          # Load each arch under a distinct local tag so `manifest create` can
          # reference both from the local cache (no registry round-trip).
          pichi load "oci-amd64" --tag "fedora:${RELEASE}-amd64"
          pichi load "oci-arm64" --tag "fedora:${RELEASE}-arm64"
          list="fedora:${RELEASE}"
          # platform.os = "pichi": a carapace is a pichi VM-guest rootfs, not a
          # thing "used on" an OS — producer and `pichi pull` agree on this token.
          # Stamp index-level provenance (whole multi-arch image); `created` is
          # added automatically.
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64" \
            -a "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -a "org.opencontainers.image.revision=${{ github.sha }}" \
            -a "org.opencontainers.image.version=${RELEASE}" \
            -a "org.opencontainers.image.title=Fedora ${RELEASE}" \
            -a "org.opencontainers.image.description=Fedora ${RELEASE} base OS carapace for pichi"
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/${{ github.repository }}:${RELEASE}"

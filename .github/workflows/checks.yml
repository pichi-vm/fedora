name: checks

on:
  workflow_call:
  workflow_dispatch:

# These checks run alongside image builds and gate publication.
permissions:
  contents: read

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install HawkEye
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: hawkeye@6.5.0
      - run: hawkeye check --config licenserc.toml

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"

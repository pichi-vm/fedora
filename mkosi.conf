#
# Fedora base for the pichi ecosystem — the root carapace of the combined
# base OS image (carapace + detached DTB + PMI + config).
#
# Output is a rootfs *directory*. The kernel is installed so `/usr/lib/modules/
# <KVER>` (the modules the running system loads after pivot) and a matching
# `vmlinuz` come from ONE build — the single source of truth for the kernel
# version shared by the PMI, the initramfs modules, and this rootfs.
#
# This one mkosi run builds the rootfs carapace; build.sh then assembles a tiny
# custom initramfs (static `carapace` init + a few .ko) — no systemd/udev:
#   * mkosi.finalize copies `vmlinuz` + the kernel `config` out for the PMI,
#     exports the initramfs module set (the carapace-boot pivot modules that
#     aren't builtin, + deps) to $OUTPUTDIR/initrd-mods/, and STRIPS `/boot` and
#     the in-tree kernel image (boot payload is the PMI's domain; the carapace
#     keeps only its `.ko` module tree);
#   * mkosi.repart/ packs the stripped tree into a single bare ext4 root
#     partition, emitted as a standalone `.raw` via SplitArtifacts=partitions
#     (no GPT wrapper) — the carapace `pichi import` consumes directly.

[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
Output=fedora
SplitArtifacts=partitions

[Content]
# Not a self-booting disk (no bootloader); the PMI boots it. `systemd` is the
# real init the initramfs pivots into; `kernel-core` provides the module tree
# (and the vmlinuz mkosi.finalize extracts for the PMI, both stripped after).
Bootable=no
Packages=
        filesystem
        systemd
        systemd-udev
        kernel-core
        bash
        coreutils
        dnf
        glibc-minimal-langpack
        ca-certificates

# Prune guest-irrelevant kernel modules from the rootfs too: fewer modaliases
# for udev coldplug to match/probe after pivot (a ~1s chunk of the boot), and a
# smaller carapace. A virtio guest never uses these; kept as .ko for the running
# system are only what it might actually load.
RemoveFiles=/usr/lib/modules/*/kernel/drivers/gpu
            /usr/lib/modules/*/kernel/drivers/net/ethernet
            /usr/lib/modules/*/kernel/drivers/net/wireless
            /usr/lib/modules/*/kernel/drivers/infiniband
            /usr/lib/modules/*/kernel/drivers/accel
            /usr/lib/modules/*/kernel/drivers/media
            /usr/lib/modules/*/kernel/sound
            /usr/lib/modules/*/kernel/fs/xfs
            /usr/lib/modules/*/kernel/fs/btrfs
            /usr/lib/modules/*/kernel/fs/ocfs2
            /usr/lib/modules/*/kernel/fs/gfs2
            /usr/lib/modules/*/kernel/fs/cifs
            /usr/lib/modules/*/kernel/fs/smb
            /usr/lib/modules/*/kernel/fs/ceph
            /usr/lib/modules/*/kernel/fs/nfs
            /usr/lib/modules/*/kernel/fs/nfsd
            /usr/lib/modules/*/kernel/net/ceph
            /usr/lib/modules/*/kernel/net/sunrpc
            /usr/lib/modules/*/kernel/kernel/kheaders.ko*

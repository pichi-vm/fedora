#
# Fedora base for the pichi ecosystem — the root carapace of the combined
# base OS image (carapace + detached DTB + PMI + config).
#
# Output is a rootfs *directory*. The kernel is installed so `/usr/lib/modules/
# <KVER>` (the modules the running system loads after pivot) and a matching
# `vmlinuz` come from ONE build — the single source of truth for the kernel
# version shared by the PMI, the initramfs modules, and this rootfs.
#
# One mkosi run builds everything:
#   * the initrd subimage (mkosi.images/initrd/, pulled in via Dependencies=),
#     sharing this build's package snapshot so its kernel matches ours;
#   * mkosi.finalize copies `vmlinuz` + the kernel `config` to the output dir
#     for the PMI, then STRIPS `/boot` and the in-tree kernel image — `/boot`
#     and the kernel are boot payload (the PMI's domain); the carapace is
#     userspace plus the matching `.ko` module tree, nothing bootable;
#   * mkosi.repart/ packs the stripped tree into a single bare ext4 root
#     partition, emitted as a standalone `.raw` via SplitArtifacts=partitions
#     (no GPT wrapper) — the carapace `pichi import` consumes directly.

[Config]
# Build the initrd subimage (mkosi.images/initrd/) as part of this run.
Dependencies=initrd

[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
Output=fedora
SplitArtifacts=partitions

[Content]
# Not a self-booting disk (no bootloader); the PMI boots it. `systemd` is the
# real init the initramfs pivots into; `kernel-core` provides the module tree
# (and the vmlinuz mkosi.finalize extracts for the PMI, both stripped after).
Bootable=no
Packages=
        filesystem
        systemd
        systemd-udev
        kernel-core
        bash
        coreutils
        dnf
        glibc-minimal-langpack
        ca-certificates
